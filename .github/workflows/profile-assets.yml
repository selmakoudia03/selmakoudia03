name: profile-assets

on:
  schedule:
    - cron: "17 3 * * *"   # tous les jours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml"]

permissions:
  contents: write

jobs:
  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: refresh 3D contributions"; then
            git pull --rebase && git push
          fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#A371F7&color_dots=#161B22,#0E4429,#1F6FEB,#8957E5,#F778BA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F778BA&color_dots=#161B22,#0E4429,#1F6FEB,#8957E5,#F778BA
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
